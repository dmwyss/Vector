<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector</title>
<link rel="stylesheet" type="text/css" href="../css/base.css" />
<link rel="stylesheet" type="text/css" href="../css/canv.css" />
<link rel="stylesheet" type="text/css" href="../css/utilModal.css" />
<script src="../data/oDrawing.js"></script>
<script src="../js/base.js"></script>
<script src="../js/uiState.js"></script>
<script src="../js/svgImpl.js"></script>
<script src="../js/utilDom.js"></script>
<script src="../js/utilSvg.js"></script>
<script src="../js/utilModal.js"></script>
<script src="../js/utilJson.js"></script>
<script src="../js/utilGeometry.js"></script>
<script src="../js/modalImpl.js"></script>
<!--<script src="../js/dragAndDrop.js"></script>-->
</head>
<body onload="doOnLoad();">

    <!-- Obere Leiste -->
    <header>
        <h1>vector</h1>
        <div class="button-group">
            <button onclick="modalImpl.fileSettings.show();">File Info</button>
            <button>Bearbeiten</button>
            <button>Optionen</button>
        </div>
    </header>

    <!-- Unterer Layout-Container -->
    <div class="wrapper">

        <!-- Linke Leiste mit Icon-Buttons (Nutzt Unicode-Symbole als Icons) -->
        <aside id="toolBar">
            <button id="selectGroup" class="icon-btn" onclick="uiState.setToolCurr(this);" title="Pinsel"><img src="../img/toolbar.selectGroup.svg"/></button>
            <button id="selectTween" class="icon-btn" onclick="uiState.setToolCurr(this);" title="Radiergummi"><img src="../img/toolbar.selectTween.svg"/></button>
            <button id="pen" class="icon-btn" onclick="uiState.setToolCurr(this);" title="Formen"><img src="../img/toolbar.pencil.svg"/></button>
        </aside>

        <!-- canv -->
        <div id="canv">
            <div id="canvRulerH" class="rulerH"></div>
            <div id="canvRulerV" class="rulerV"></div>
            <div id="canvDrawing" class="drawing">
                <div id="canvBounds" class="canvBounds">
                    <svg id="svgDrawing" viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
                    </svg>
                </div>
            </div>
        </div>
        <!-- canv -->

    <!-- Modal-Struktur -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <!-- Schließen-Kreuz oben -->
            <button class="close-x-btn" id="closeXBtn">&times;</button>

            <!-- Hauptinhalt des Modals -->
            <div class="modal-body">
                <h2 class="modal-title">File</h2>
                <table>
                    <tbody>
                        <tr>
                            <td>Width</td>
                            <td><input type="number" id="canvDimensionsW"/></td>
                        </tr>
                        <tr>
                            <td>Height</td>
                            <td><input type="number" id="canvDimensionsH"/></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Hauptinhalt des Modals -->
            <!-- Banner / Footer am unteren Rand -->
            <div class="modal-banner">
                <button class="btn btn-cancel" id="cancelBtn" onclick="utilModal.hide();">Abbrechen</button>
                <button class="btn btn-save" id="saveBtn" onclick="utilModal.save();">Speichern</button>
            </div>
            <!-- Banner / Footer am unteren Rand -->
        </div>
    </div>




    </div>
</body>
</html>
